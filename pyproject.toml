[project]
name = "el-chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.163.2",
    "fastembed>=0.9.1",
    "google-genai>=3.5.0",
    "lxml>=6.1.3",
    "markdown>=3.11.3",
    "mistralai>=3.7.0",
    "numpy>=2.5.5",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::bs4.XMLParsedAsHTMLWarning"]

[tool.ruff]
line-length = 120
