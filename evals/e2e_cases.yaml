  source: Art. 75(1)
  lexical_overlap: 0.33
- id: e0995
  category: provision
  subtype: explicit_ref
  split: dev
  turns:
  - Under Article 59(1)(d), how must personal data be kept and accessed in an AI regulatory sandbox?
  expect: answer
  gold:
  - art_59_1_d
  facts:
  - text: prospective provider
    alternatives:
    - potential provider
    - provider
  - text: authorised persons
    alternatives:
    - authorized persons
    - authorised personnel
    - authorized staff
  - text: isolated
    alternatives:
    - separated
    - segregated
  reference_answer: Under Article 59(1)(d), any personal data processed in the AI regulatory sandbox must be kept in a functionally separate,
    isolated, and protected data processing environment. This environment must be under the control of the prospective provider, and only authorised
    persons are allowed to access the data.
  source: Art. 59(1)(d)
  lexical_overlap: 0.57
- id: e0996
  category: provision
  subtype: natural
  split: dev
  turns:
  - Can an AI creator argue that their model doesn't pose a systemic risk even if it meets the criteria?
  expect: answer
  gold:
  - art_52_2
  facts:
  - text: systemic risks
    alternatives:
    - systemic risk
  - text: notification
    alternatives:
    - notice
    - submission
  - text: sufficiently substantiated arguments
    alternatives:
    - substantiated arguments
    - strong evidence
    - detailed reasons
  reference_answer: Yes, the provider of a general-purpose AI model can include sufficiently substantiated arguments with its notification to
    show that the model does not present systemic risks due to its specific characteristics. By doing so, they can argue that it should exceptionally
    not be classified as a general-purpose AI model with systemic risk, even though it meets the relevant requirement.
  source: Art. 52(2)
  lexical_overlap: 0.4
