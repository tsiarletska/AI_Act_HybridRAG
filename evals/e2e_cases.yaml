- id: e0988
  category: provision
  subtype: natural
  split: dev
  turns:
  - What do I need to submit when applying for a technical documentation review?
  expect: answer
  gold:
  - anx_VII_4
  facts:
  - text: name and address
    alternatives:
    - contact details
    - identity and address
  - text: written declaration
    alternatives:
    - written statement
    - signed declaration
  - text: technical documentation
    alternatives:
    - technical files
    - system documentation
  reference_answer: The application must include the provider's name and address, as well as the technical documentation. It must also contain
    a written declaration confirming that the same application has not been submitted to any other notified body.
  source: Annex VII, point 4
  lexical_overlap: 0.33
- id: e0989
  category: provision
  subtype: natural
  split: dev
  turns:
  - How must high-risk AI systems be built to deal with errors and ongoing learning?
  expect: answer
  gold:
  - art_15_4
  facts:
  - text: resilient
    alternatives:
    - resilience
    - robust
    - robustness
  - text: feedback loops
    alternatives:
    - biased outputs influencing input
    - biased outputs affecting future operations
  reference_answer: High-risk AI systems must be as resilient as possible to errors, faults, or inconsistencies, using technical and organisational
    measures such as backup or fail-safe plans. If they continue to learn after being placed on the market or put into service, they must be developed
    to eliminate or reduce the risk of biased outputs influencing future inputs (feedback loops) and address them with appropriate mitigation
    measures.
  source: Art. 15(4)
  lexical_overlap: 0.5
- id: e0990
  category: provision
  subtype: natural
  split: dev
  turns:
  - What do importers have to watch out for when they are responsible for storing or moving a high-risk AI?
  expect: answer
  gold:
  - art_23_4
  facts:
  - text: storage
    alternatives:
    - storing
    - keeping
  - text: transport
    alternatives:
    - transporting
    - moving
    - shipping
  - text: compliance
    alternatives:
    - complying
    - meeting the requirements
    - following the rules
  reference_answer: Importers must ensure that, while a high-risk AI system is under their responsibility, its storage or transport conditions
    do not jeopardise its compliance with the relevant requirements.
  source: Art. 23(4)
  lexical_overlap: 0.43
- id: e0991
  category: provision
  subtype: natural
  split: dev
  turns:
  - What kind of user guide must come with a high-risk AI tool?
  expect: answer
  gold:
  - art_13_2
  facts:
  - text: instructions for use
    alternatives:
    - user manual
    - user guide
    - documentation
  - text: digital format
    alternatives:
    - electronic format
    - digital
  - text: deployers
    alternatives:
    - users
    - operators
  reference_answer: High-risk AI systems must be accompanied by instructions for use, which can be provided in an appropriate digital format or
    another format. This information must be concise, complete, correct, clear, relevant, accessible, and comprehensible to deployers.
  source: Art. 13(2)
  lexical_overlap: 0.29
- id: e0992
  category: provision
  subtype: natural
  split: dev
  turns:
  - If my AI system follows the common specifications, is it automatically considered compliant with the rules?
  expect: answer
  gold:
  - art_41_3
  facts:
  - text: common specifications
    alternatives:
    - specifications
    - official specifications
  - text: presumed
    alternatives:
    - assumed
    - considered
    - presumption
  - text: requirements
    alternatives:
    - obligations
    - rules
  reference_answer: Yes, high-risk AI systems or general-purpose AI models that conform to the common specifications, or parts of them, are presumed
    to meet the corresponding requirements or obligations. This applies to the extent that those common specifications cover those requirements
    or obligations.
  source: Art. 41(3)
  lexical_overlap: 0.25
- id: e0993
  category: provision
  subtype: natural
