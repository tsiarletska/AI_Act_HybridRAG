  reference_answer: Authorities consider all relevant circumstances, including the nature, gravity, and duration of the infringement, as well
    as the operator's size, annual turnover, and market share. They also look at the operator's degree of responsibility and cooperation, whether
    the infringement was intentional or negligent, any actions taken to mitigate harm, and any previous fines or financial benefits gained.
  source: Art. 100(1), Art. 99(7)
