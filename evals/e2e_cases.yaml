  gold:
  - art_100_6
  allowed:
  - art_100_1
  facts:
  - text: general budget
    alternatives:
    - EU budget
    - Union budget
    - budget of the Union
  reference_answer: The money collected from these fines goes into the general budget of the Union. Additionally, the fines must not interfere
    with the effective operation of the fined institution, body, office, or agency.
  source: Art. 100(1) -> Art. 100(6)
- id: e0612
  category: multi_turn
  subtype: followup
  split: test
  turns:
  - Who is responsible for supervising and enforcing the rules for general-purpose AI?
  - Can market surveillance authorities ask it to use those powers?
  expect: answer
  gold:
  - art_88_2
  allowed:
  - art_88_1
  facts:
  - text: market surveillance authorities
    alternatives:
    - surveillance authorities
    - national authorities
  - text: necessary and proportionate
    alternatives:
    - needed and proportionate
    - proportionate and necessary
  reference_answer: Yes, market surveillance authorities may request the Commission to exercise these powers when it is necessary and proportionate
    to help them fulfil their tasks under the Regulation.
  source: Art. 88(1) -> Art. 88(2)
- id: e0613
  category: multi_turn
  subtype: followup
  split: test
  turns:
  - How do EU countries support small businesses and start-ups under the AI Act?
  - What about the fees they have to pay for conformity assessments?
  expect: answer
  gold:
  - art_62_2
  allowed:
  - art_62_1
  facts:
  - text: reducing
    alternatives:
    - reduced
    - lower
    - lowering
    - cut
  - text: proportionately
    alternatives:
    - proportionate
    - in proportion
  - text: market size
    alternatives:
    - size of the market
  reference_answer: The specific interests and needs of SME providers, including start-ups, are taken into account when setting conformity assessment
    fees. Those fees are reduced proportionately based on their size, market size, and other relevant indicators.
  source: Art. 62(1) -> Art. 62(2)
- id: e0614
  category: multi_turn
  subtype: followup
  split: test
  turns:
  - When deciding if an AI system should be classified as high-risk, does the Commission look at whether people can opt out of its outcomes?
  - And does it also consider what the system is meant to be used for?
  expect: answer
  gold:
  - art_7_2_a
  allowed:
  - art_7_2_g
  facts:
  - text: intended purpose
    alternatives:
    - purpose
    - what it is used for
    - intended use
  reference_answer: Yes, when making that assessment, the Commission also takes into account the intended purpose of the AI system.
  source: Art. 7(2)(g) -> Art. 7(2)(a)
- id: e0615
  category: multi_turn
  subtype: followup
  split: test
  turns:
  - Does the technical documentation for an AI system have to include all the listed information, or only what applies to that specific system?
  - And what does it need to include about conformity and monitoring after the system is on the market?
  expect: answer
  gold:
  - anx_IV_8-9
  allowed:
  - anx_IV_intro
  facts:
  - text: EU declaration of conformity
    alternatives:
    - declaration of conformity
  - text: post-market monitoring plan
    alternatives:
    - monitoring plan
    - post-market monitoring
  reference_answer: It must include a copy of the EU declaration of conformity and a detailed description of the system used to evaluate the AI
    system's performance in the post-market phase, including the post-market monitoring plan.
  source: Annex IV -> Annex IV, points 8–9
