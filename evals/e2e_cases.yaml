- id: e1000
  category: provision
  subtype: explicit_ref
  split: test
  turns:
  - Under Article 34(2), how should notified bodies handle smaller businesses when doing their work?
  expect: answer
  gold:
  - art_34_2
  facts:
  - text: micro- and small enterprises
    alternatives:
    - small businesses
    - smaller companies
    - micro and small enterprises
  - text: Recommendation 2003/361/EC
    alternatives:
    - 2003/361/EC
  - text: unnecessary burdens
    alternatives:
    - extra burdens
    - needless burdens
    - excessive burdens
  reference_answer: Under Article 34(2), notified bodies must avoid creating unnecessary burdens for providers and consider factors like the provider's
    size, sector, structure, and the complexity of the AI system. They should especially aim to reduce administrative burdens and compliance costs
    for micro- and small enterprises as defined in Recommendation 2003/361/EC, while still maintaining the required rigour and level of protection.
  source: Art. 34(2)
