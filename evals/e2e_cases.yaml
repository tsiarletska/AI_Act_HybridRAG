    - manipulated
  reference_answer: Providers of AI systems that generate synthetic text content must ensure the outputs are marked in a machine-readable format
    and are detectable as artificially generated or manipulated. The technical solutions used must be effective, interoperable, robust, and reliable
    as far as technically feasible. However, this obligation does not apply if the system only performs an assistive function for standard editing
    or does not substantially alter the input data or its semantics.
  source: Art. 50(2)
- id: e0523
  category: rare_term
  subtype: prototyping activities
  split: dev
