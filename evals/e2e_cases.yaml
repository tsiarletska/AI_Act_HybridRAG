  reference_answer: No, AI models used solely for research, development, or prototyping activities before being placed on the market are excluded
    from the definition of a general-purpose AI model. However, if the model is subsequently placed on the market after those activities, you
    must comply with the regulation's obligations.
  source: Art. 3(63), Recital 97
